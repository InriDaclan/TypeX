<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TypeX</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <!-- Header -->
    <header>
        <div class="logo">TypeX</div>
        <nav>
            <ul>
                <li><a href="#" data-section="test">Type Test</a></li>
                <li><a href="#" data-section="practice">Practice</a></li>
                <li><a href="#" data-section="stats">Statistics</a></li>
                <li><a href="#" data-section="settings">Settings</a></li>
            </ul>
        </nav>
        <div class="profile-btn">⚙️</div>
    </header>

    <!-- Main Content -->
    <main>
        <!-- Typing Test Section -->
        <section id="test" class="page active">
            <div class="test-container">
                <div class="stats">
                    <div class="stat">
                        <label>WPM</label>
                        <div id="wpm">0</div>
                    </div>
                    <div class="stat">
                        <label>Accuracy</label>
                        <div id="accuracy">100%</div>
                    </div>
                    <div class="stat">
                        <label>Time</label>
                        <div id="time">60s</div>
                    </div>
                    <div class="stat">
                        <label>Errors</label>
                        <div id="errors">0</div>
                    </div>
                </div>
                <div class="typing-area">
                    <div id="text-display"></div>
                    <input type="text" id="typing-input" autocomplete="off">
                </div>
                <div class="restart-btn" id="restart-btn">Restart Test</div>
            </div>
        </section>

        <!-- Practice Section -->
        <section id="practice" class="page">
            <div class="practice-container">
                <h2>Practice Mode</h2>
                <div class="difficulty-select">
                    <button class="difficulty-btn active" data-level="beginner">Beginner</button>
                    <button class="difficulty-btn" data-level="intermediate">Intermediate</button>
                    <button class="difficulty-btn" data-level="advanced">Advanced</button>
                </div>
                <div class="practice-text">
                    <p id="practice-display"></p>
                    <input type="text" id="practice-input" autocomplete="off">
                </div>
                <div class="practice-stats">
                    <div class="stat">
                        <label>WPM</label>
                        <div id="practice-wpm">0</div>
                    </div>
                    <div class="stat">
                        <label>Accuracy</label>
                        <div id="practice-accuracy">100%</div>
                    </div>
                </div>
            </div>
        </section>

        <!-- Statistics Section -->
        <section id="stats" class="page">
            <div class="stats-container">
                <h2>Statistics</h2>
                <div class="stats-grid">
                    <div class="stat-card">
                        <h3>Best WPM</h3>
                        <div id="best-wpm">0</div>
                    </div>
                    <div class="stat-card">
                        <h3>Average WPM</h3>
                        <div id="avg-wpm">0</div>
                    </div>
                    <div class="stat-card">
                        <h3>Best Accuracy</h3>
                        <div id="best-accuracy">0%</div>
                    </div>
                    <div class="stat-card">
                        <h3>Tests Completed</h3>
                        <div id="tests-completed">0</div>
                    </div>
                </div>
                <div class="reset-stats-btn" id="reset-stats">Reset Statistics</div>
            </div>
        </section>

        <!-- Settings Section -->
        <section id="settings" class="page">
            <div class="settings-container">
                <h2>Settings</h2>
                <div class="settings-group">
                    <h3>Test Duration</h3>
                    <div class="duration-options">
                        <button class="duration-btn active" data-time="15">15s</button>
                        <button class="duration-btn" data-time="30">30s</button>
                        <button class="duration-btn" data-time="60">60s</button>
                        <button class="duration-btn" data-time="120">120s</button>
                    </div>
                </div>
                <div class="settings-group">
                    <h3>Theme</h3>
                    <div class="theme-options">
                        <button class="theme-btn active" data-theme="dark">Dark</button>
                        <button class="theme-btn" data-theme="light">Light</button>
                        <button class="theme-btn" data-theme="blue">Blue</button>
                    </div>
                </div>
                <div class="settings-group">
                    <h3>Preferences</h3>
                    <label class="toggle-switch">
                        <input type="checkbox" id="sound-toggle">
                        <span class="slider"></span>
                        Sound Effects
                    </label>
                    <label class="toggle-switch">
                        <input type="checkbox" id="highlight-toggle" checked>
                        <span class="slider"></span>
                        Highlight Errors
                    </label>
                </div>
                <div class="save-settings-btn" id="save-settings">Save Settings</div>
            </div>
        </section>

        <!-- Results Screen (initially hidden) -->
        <section id="results" class="page results-screen">
            <div classresults-container>
                <h2>Test Complete</h2>
                <div class="results-stats">
                    <div class="stat">
                        <label>WPM</label>
                        <div id="result-wpm">0</div>
                    </div>
                    <div class="stat">
                        <label>Accuracy</label>
                        <div id="result-accuracy">0%</div>
                    </div>
                    <div class="stat">
                        <label>Characters</label>
                        <div id="result-chars">0</div>
                    </div>
                    <div class="stat">
                        <label>Errors</label>
                        <div id="result-errors">0</div>
                    </div>
                    <div class="stat">
                        <label>Time</label>
                        <div id="result-time">0s</div>
                    </div>
                </div>
                <div class="results-buttons">
                    <button id="try-again">Try Again</button>
                    <button id="new-test">New Test</button>
                </div>
            </div>
        </section>
    </main>

    <script src="script.js"></script>
</body>
</html>
